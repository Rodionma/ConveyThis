x-php: &php
  build:
    context: .
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: file-storage-php
  volumes:
    - ./:/var/www/html
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
    RABBITMQ_HOST: rabbitmq
    MAIL_HOST: mailpit
  restart: unless-stopped

services:
  app:
    <<: *php
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    <<: *php
    user: www-data
    command: php artisan queue:work rabbitmq --queue=file-notifications --tries=3 --sleep=1
    depends_on:
      - app

  scheduler:
    <<: *php
    user: www-data
    command: php artisan schedule:work
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${FORWARD_RABBITMQ_PORT:-5672}:5672"
      - "${FORWARD_RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  mysql-data:
